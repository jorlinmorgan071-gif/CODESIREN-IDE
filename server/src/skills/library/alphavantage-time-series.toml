# Alpha Vantage — TIME_SERIES_DAILY
# Fetches daily OHLCV (open/high/low/close/volume) for a stock symbol.
# Requires ALPHA_VANTAGE_KEY env var — key sent as `apikey` query param.
# Free tier: 25 requests/day (per Alpha Vantage documentation).
# Input: { "symbol": "IBM" } → returns daily time series JSON
#
# ── Deviation note (Batch 7, post-sign-off correction) ─────────────────
# Section 0 confirmed a single Alpha Vantage skill plan (GLOBAL_QUOTE only).
# This second skill (TIME_SERIES_DAILY) was added beyond that plan and
# explicitly confirmed by the user after the fact. Reasoning:
#   - GLOBAL_QUOTE  → real-time snapshot (current price, change, volume)
#   - TIME_SERIES_DAILY → historical OHLCV for trend analysis / charting
# These are distinct use cases with different output shapes.
#
# CAVEAT — shared quota: both skills draw from the same 25-req/day
# Alpha Vantage API key budget. A user running both skills daily will
# exhaust the budget faster than running just one. The user controls
# how the budget is spent; the skill does not auto-throttle.
# ────────────────────────────────────────────────────────────────────────

name = "alphavantage-time-series"
version = "0.1.0"
description = "Fetch daily OHLCV stock prices via Alpha Vantage. Input: { \"symbol\": \"IBM\" }"
author = "code-siren-phase-d"
required_capabilities = ["http_request"]

[[steps]]
tool_name = "http_request"
arguments_template = '{"url": "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol={{symbol}}&outputsize=compact", "method": "GET", "api_key_env": "ALPHA_VANTAGE_KEY", "api_key_placement": "query", "api_key_query_param": "apikey"}'
output_key = "time_series"
