# OpenWeatherMap Current Weather
# Fetches current weather conditions by city name.
# Requires OPENWEATHERMAP_KEY env var — key sent as appid query param.
# Free tier: 60 calls/minute for current weather.
# Input: { "city": "London" } → returns current weather as JSON

name = "owm-current-weather"
version = "0.1.0"
description = "Get current weather by city via OpenWeatherMap. Input: { \"city\": \"London\" }"
author = "code-siren-phase-d"
required_capabilities = ["http_request"]

[[steps]]
tool_name = "http_request"
arguments_template = '{"url": "https://api.openweathermap.org/data/2.5/weather?q={{city}}&units=metric", "method": "GET", "api_key_env": "OPENWEATHERMAP_KEY", "api_key_placement": "query", "api_key_query_param": "appid"}'
output_key = "weather"
