# Cat Facts
# Fetches a random cat fact.
# No API key required — public API.
# Input: {} → returns a random cat fact as JSON

name = "cat-facts"
version = "0.1.0"
description = "Get a random cat fact. No input required."
author = "code-siren-phase-d"
required_capabilities = ["http_request"]

[[steps]]
tool_name = "http_request"
arguments_template = '{"url": "https://catfact.ninja/fact", "method": "GET"}'
output_key = "fact"
