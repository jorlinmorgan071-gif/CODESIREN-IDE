# MapTiler Geocoding
# Forward geocoding: converts a place name to coordinates.
# Requires MAPTILER_API_KEY env var — key sent as key query param.
# Free tier: 100,000 requests/month for geocoding.
# Input: { "query": "Eiffel Tower" } → returns geocoded results as JSON

name = "maptiler-geocode"
version = "0.1.0"
description = "Geocode a place name to coordinates via MapTiler. Input: { \"query\": \"Eiffel Tower\" }"
author = "code-siren-phase-d"
required_capabilities = ["http_request"]

[[steps]]
tool_name = "http_request"
arguments_template = '{"url": "https://api.maptiler.com/geocoding/{{query}}.json", "method": "GET", "api_key_env": "MAPTILER_API_KEY", "api_key_placement": "query", "api_key_query_param": "key"}'
output_key = "results"
