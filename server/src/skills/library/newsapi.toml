# NewsAPI — Top headlines
# Fetches top news headlines by country/category.
# Requires NEWSAPI_KEY env var — key sent as X-Api-Key header.
# Input: { "country": "us", "category": "technology" } → returns articles as JSON

name = "newsapi-headlines"
version = "0.1.0"
description = "Fetch top news headlines via NewsAPI. Input: { \"country\": \"us\", \"category\": \"technology\" }"
author = "code-siren-phase-d"
required_capabilities = ["http_request"]

[[steps]]
tool_name = "http_request"
arguments_template = '{"url": "https://newsapi.org/v2/top-headlines?country={{country}}&category={{category}}", "method": "GET", "api_key_env": "NEWSAPI_KEY", "api_key_placement": "header"}'
output_key = "headlines"
