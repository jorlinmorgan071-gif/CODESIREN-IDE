# GNews — News search
# Searches news articles by query.
# Requires GNEWS_KEY env var — key sent as ?apiKey= query param.
# Input: { "query": "artificial intelligence" } → returns articles as JSON

name = "gnews-search"
version = "0.1.0"
description = "Search news articles via GNews. Input: { \"query\": \"artificial intelligence\" }"
author = "code-siren-phase-d"
required_capabilities = ["http_request"]

[[steps]]
tool_name = "http_request"
arguments_template = '{"url": "https://gnews.io/api/v4/search?q={{query}}&lang=en&max=5", "method": "GET", "api_key_env": "GNEWS_KEY", "api_key_placement": "query", "api_key_query_param": "apiKey"}'
output_key = "articles"
