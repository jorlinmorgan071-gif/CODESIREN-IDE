# docker-compose.yml — Code Siren IDE
#
# Brings the whole app up with one command:
#
#   echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up --build
#
# Services:
#   db      PostgreSQL 16 (the server's backing store)
#   server  Express + WS backend on :3001 (compiled production build)
#   app     React/Vite frontend on :8080 (nginx-served static build)
#
# The app talks to the server over the compose network. From the host,
# open http://localhost:8080 after `docker compose up`.
#
# JWT_SECRET is REQUIRED — compose refuses to start without it. The
# server's config guard (server/src/config.ts) rejects any secret shorter
# than 32 chars and crashes on boot if a known dev default is used in
# production, so there is no built-in fallback. Generate one with
# `openssl rand -hex 32` and put it in a .env file next to this compose
# file (docker compose reads .env automatically):
#
#   echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: code_siren
      POSTGRES_USER: code_siren
      POSTGRES_PASSWORD: code_siren
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bind Postgres to localhost only — the server reaches it over the
    # compose network (PG_HOST=db) and never needs the published port.
    # Publishing on 0.0.0.0 would expose the database to every interface
    # on the host, which is not wanted by default. To open it for an
    # external tool, override the port mapping in a compose override file.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_siren -d code_siren"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # PG — matches the `db` service above
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: code_siren
      PG_USER: code_siren
      PG_PASSWORD: code_siren
      # JWT_SECRET — REQUIRED. The :? form makes compose fail fast with a
      # clear message if it is unset, instead of booting a server that
      # signs tokens with an empty/weak secret. MUST be >= 32 chars.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      # Terminal: off by default in production (gate 1). Set to "true" AND
      # promote the user to plan=admin (npm run make-admin -- <email> in
      # the server container) to enable the live PTY. node-pty is loaded
      # lazily — if its native binary is missing the terminal is disabled
      # with a clear message and the rest of the server still boots.
      TERMINAL_ENABLED: "false"
      CORS_ORIGINS: "http://localhost:8080,http://localhost:3000,http://localhost:5173"
    ports:
      - "3001:3001"
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # The app's Vite build bakes these in at compile time. Inside the
        # compose network the app container talks to the `server` service,
        # but the browser (on the host) reaches the server via localhost:3001.
        VITE_API_URL: http://localhost:3001/api
        VITE_WS_URL: ws://localhost:3001/ws
    depends_on:
      - server
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
    driver: local
