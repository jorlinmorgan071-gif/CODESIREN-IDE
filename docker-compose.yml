# docker-compose.yml — Code Siren IDE
#
# Brings the whole app up with one command:
#
#   docker compose up --build
#
# Services:
#   db      PostgreSQL 16 (the server's optional backing store; without it
#           the server runs in degraded in-memory mode, but compose gives
#           you the real thing)
#   server  Express + WS backend on :3001 (compiled production build)
#   app     React/Vite frontend on :8080 (nginx-served static build)
#
# The app talks to the server over the compose network. From the host,
# open http://localhost:8080 after `docker compose up`.
#
# First-run JWT_SECRET is generated by the server's config guard if you
# don't set it — but for a real deploy, set it in a .env file next to
# this compose file:
#
#   echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: code_siren
      POSTGRES_USER: code_siren
      POSTGRES_PASSWORD: code_siren
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_siren -d code_siren"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # PG — matches the `db` service above
      PG_HOST: db
      PG_PORT: 5432
      PG_DB: code_siren
      PG_USER: code_siren
      PG_PASSWORD: code_siren
      # JWT_SECRET — read from the host .env file (or the random default
      # below for a throwaway demo). MUST be >= 32 chars.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-32-chars-min}
      # Terminal: off by default in production (gate 1). Set to "true" AND
      # give the user plan=admin to enable the live PTY (see server/src/ws/server.ts).
      TERMINAL_ENABLED: "false"
      CORS_ORIGINS: "http://localhost:8080,http://localhost:3000,http://localhost:5173"
    ports:
      - "3001:3001"
    restart: unless-stopped

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # The app's Vite build bakes these in at compile time. Inside the
        # compose network the app container talks to the `server` service,
        # but the browser (on the host) reaches the server via localhost:3001.
        VITE_API_URL: http://localhost:3001/api
        VITE_WS_URL: ws://localhost:3001/ws
    depends_on:
      - server
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
    driver: local
