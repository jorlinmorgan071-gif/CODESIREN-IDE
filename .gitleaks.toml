# gitleaks.toml — configuration for Code Siren secret scanning.
#
# This config extends gitleaks's built-in rules. Path-based allowlists are
# NOT used for test files — every file is scanned. Only specific synthetic
# strings that appear in source (e.g. the dev-default JWT_SECRET in
# .env.example, the test JWT secret in vitest.config.ts) are allowlisted
# via exact regexes.
#
# Token-shaped test fixtures are built at RUNTIME via the seeded PRNG in
# server/tests/helpers/fake-tokens.ts. No token literal appears in source,
# so no allowlist is needed for them — gitleaks simply has nothing to find.
#
# Usage:
#   gitleaks detect --config .gitleaks.toml --source . --verbose --redact=0
#   # Full history (post-purge verification):
#   gitleaks detect --config .gitleaks.toml --source . --log-opts="--all" --verbose --redact=0

[extend]
# Inherit all built-in rules (github-token, aws-access-key, etc.) without
# redefining them. This keeps the config in sync with upstream gitleaks rules.
useDefault = true

# ── Allowlist ───────────────────────────────────────────────────────────
# Only specific synthetic strings are allowlisted — NO path-based allowlist.
# If a test needs a token-shaped string, it must build it at runtime via
# fake-tokens.ts so no literal appears in source.

[allowlist]
description = "Specific synthetic dev-default strings only (no path allowlist)"

# These are the ONLY synthetic strings allowlisted. Each is an exact regex
# matching a known dev/test default that is not a real secret.

# .env.example dev default JWT_SECRET (43 chars, matches zod min(32)).
# Shipped in .env.example so the server boots for local dev. The production
# guard in config.ts rejects this value when NODE_ENV=production.
regexes = [
  '''dev-only-change-me-in-production-32-chars-min''',
  # vitest.config.ts test JWT secret (36 chars) — set as process.env.JWT_SECRET
  # before config.ts validates it. Never used in production.
  '''test-secret-at-least-32-chars-long''',
  # Test-only JWT secret variant used in some agent tests.
  '''test-secret-32-chars-minimum-padding''',
]
