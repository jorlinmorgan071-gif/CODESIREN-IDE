name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server:
    name: Server (typecheck + tests + grep-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run typecheck
      - run: npm run test -- --exclude tests/unit/run-tests.test.ts --exclude tests/unit/ghost-remediation.test.ts --exclude tests/unit/playwright-client.test.ts --exclude tests/unit/workflow-runner.test.ts --exclude tests/unit/upr-phase1-step2b-abortsignal-cap.test.ts
      - run: bash ../scripts/grep-audit.sh
      - name: Boot smoke test
        run: |
          cp .env.example .env
          npx tsx src/index.ts &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "✓ Server responded to /api/health"
              break
            fi
            sleep 0.5
          done
          if ! curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
            echo "✗ Server did not respond to /api/health within 15 seconds"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          kill -SIGTERM $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "✓ Server started, responded to health check, and shut down cleanly"

  app:
    name: App (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npm run build

  audit:
    name: Security Audit (npm audit --audit-level=high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Server audit
        working-directory: server
        run: npm ci && npm audit --audit-level=high
      - name: App audit
        working-directory: app
        run: npm ci && npm audit --audit-level=high
