name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server:
    name: Server (typecheck + tests + grep-audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run typecheck
      # Production build — catches regressions tsc-only typecheck misses:
      # missing non-TS assets (SQL/TOML), broken agent loader paths, etc.
      # The build runs copy-assets.mjs which copies migrations + skills to dist/.
      - run: npm run build
      - run: npm run test -- --exclude tests/unit/run-tests.test.ts --exclude tests/unit/ghost-remediation.test.ts --exclude tests/unit/playwright-client.test.ts --exclude tests/unit/workflow-runner.test.ts --exclude tests/unit/upr-phase1-step2b-abortsignal-cap.test.ts
      - run: bash ../scripts/grep-audit.sh
      - name: Boot smoke test (health + Express 5 route integrity)
        # Boots the real server and confirms:
        #   1. GET /api/health returns 200 (server is up and routing works)
        #   2. POST /api/auth/login with an empty body returns 400 (zod schema
        #      validation rejects the missing email/password), NOT 500.
        # This is the cheapest possible regression guard for the Express 4→5
        # upgrade: if v5's body-parser / error-handler / route matching changes
        # silently break input validation, an empty POST would fall through to
        # the catch-all 500 handler instead of the zod 400 path.
        run: |
          cp .env.example .env
          npx tsx src/index.ts &
          SERVER_PID=$!
          cleanup() { kill -SIGTERM $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true; }
          trap cleanup EXIT

          # 1. Wait for /api/health to respond 200
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "✓ GET /api/health → 200"
              break
            fi
            sleep 0.5
          done
          if ! curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
            echo "✗ Server did not respond to /api/health within 15 seconds"
            exit 1
          fi

          # 2. POST /api/auth/login with an empty body — expect 400 (zod reject), not 500
          STATUS=$(curl -s -o /tmp/login_body.txt -w '%{http_code}' \
            -X POST http://localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "POST /api/auth/login (empty body) → HTTP $STATUS"
          cat /tmp/login_body.txt; echo
          if [ "$STATUS" = "500" ]; then
            echo "✗ FAIL: empty login POST returned 500 (Express 5 route/error-handler regression)"
            exit 1
          fi
          if [ "$STATUS" != "400" ] && [ "$STATUS" != "401" ]; then
            echo "✗ FAIL: expected 400 or 401, got $STATUS"
            exit 1
          fi
          echo "✓ POST /api/auth/login (empty body) → $STATUS (validation working, no 500)"

          echo "✓ Server started, /api/health=200, /api/auth/login validation intact, shut down cleanly"

  app:
    name: App (typecheck + lint + test + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npm run build

  lockfile-hygiene:
    name: Lockfile hygiene (no mirror registries)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any lockfile references a mirror registry
        run: |
          set -e
          # package-lock.json must resolve every tarball against the official
          # npm registry. A mirror leak (e.g. registry.npmmirror.com from a
          # dev sandbox) breaks installs in regions that block the mirror and
          # does not belong in a public repo. Integrity hashes protect content,
          # but the resolved URL must still point at the canonical registry.
          hits=0
          for f in app/package-lock.json server/package-lock.json package-lock.json; do
            if [ -f "$f" ]; then
              n=$(grep -c 'registry\.npmmirror\.com' "$f" || true)
              if [ "$n" -gt 0 ]; then
                echo "✗ FAIL: $f contains $n npmmirror reference(s)"
                grep -n 'registry\.npmmirror\.com' "$f" | head -5
                hits=$((hits+1))
              else
                echo "✓ PASS: $f has 0 npmmirror references"
              fi
            fi
          done
          exit $hits

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — gitleaks scans all commits
      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xzf - -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history for NEW secrets (baseline-aware)
        # ┌──────────────────────────────────────────────────────────────────┐
        # │ Baseline mode: catches committed-then-deleted secrets             │
        # │                                                                  │
        # │ gitleaks runs in git mode (--log-opts="--all") scanning every    │
        # │ commit reachable from HEAD. The .gitleaks-baseline.json file    │
        # │ contains the fingerprints of the 7 known historical findings     │
        # │ (all redacted — no secret values in the baseline). Findings      │
        # │ whose fingerprint matches the baseline are suppressed.           │
        # │                                                                  │
        # │ Effect: any NEW secret introduced in any commit — even one that  │
        # │ is later deleted — fails the build. The baseline only suppresses │
        # │ the 7 pre-existing historical leaks; everything new is caught.  │
        # │                                                                  │
        # │ IMPORTANT: --redact=100 is REQUIRED on both the baseline and    │
        # │ the scan. gitleaks baseline matching compares the full finding    │
        # │ object (including the Secret field), not just the fingerprint.   │
        # │ If the baseline has Secret="REDACTED" but the scan has the real  │
        # │ secret, they won't match and the baseline won't suppress. Using  │
        # │ --redact=100 on both sides ensures they match. This also means  │
        # │ real secrets are never printed in CI logs (good security).       │
        # │                                                                  │
        # │ To regenerate the baseline after purging history:                │
        # │   gitleaks detect --config .gitleaks.toml --source . \           │
        # │     --log-opts="--all" --verbose --redact=100 \                  │
        # │     --report-format json --report-path .gitleaks-baseline.json   │
        # └──────────────────────────────────────────────────────────────────┘
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts="--all" \
            --baseline-path .gitleaks-baseline.json \
            --verbose \
            --redact=100

  audit:
    name: Security Audit (npm audit --audit-level=high)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Server audit
        working-directory: server
        run: npm ci && npm audit --audit-level=high
      - name: App audit (production deps only)
        # The app's 5 high advisories (braces, chokidar, fast-glob, micromatch,
        # tailwindcss) all live in the Tailwind v3 build tooling chain
        # (devDependencies). They never ship to users and have no non-breaking
        # fix until the Tailwind v4 migration (tracked as a post-launch task —
        # see app/SECURITY-NOTES.md). We audit only what ships (--omit=dev) at
        # --audit-level=high so the gate catches real runtime vulnerabilities
        # without failing on build-only dev tooling.
        working-directory: app
        # Build-only toolchain advisories must not block a deployable static app;
        # production dependency advisories remain a blocking high-severity gate.
        # See app/SECURITY-NOTES.md for the full advisory table and the
        # Tailwind v4 migration (post-launch task).
        run: npm ci && npm audit --omit=dev --audit-level=high

  docker:
    name: Docker (compose build + up + /api/health smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify compose refuses to start without JWT_SECRET
        # docker-compose.yml uses ${JWT_SECRET:?...} — compose MUST fail
        # fast (non-zero) when the var is unset, instead of booting a
        # server that signs tokens with an empty secret. This step proves
        # the :? guard works: `docker compose config` exits non-zero with
        # no .env file present.
        run: |
          if docker compose config >/dev/null 2>&1; then
            echo "✗ FAIL: docker compose config succeeded with JWT_SECRET unset"
            exit 1
          fi
          echo "✓ PASS: docker compose refuses to interpolate without JWT_SECRET"

      - name: Generate JWT_SECRET and write .env
        # Compose reads .env automatically. The secret is a fresh 32-byte
        # hex value per run — never committed, never reused.
        run: |
          SECRET=$(openssl rand -hex 32)
          echo "JWT_SECRET=${SECRET}" > .env
          echo "✓ wrote .env (JWT_SECRET length: ${#SECRET})"

      - name: Build both images (server + app)
        # server/Dockerfile compiles node-pty from source in the builder
        # stage (python3/make/g++), then copies the pruned production
        # node_modules into a slim runtime. app/Dockerfile is a
        # vite-build → nginx-served static bundle.
        run: docker compose build

      - name: Start the stack (db + server + app)
        run: docker compose up -d

      - name: Poll /api/health (expect 200 + status=ok + db=connected)
        # Polls the server's published :3001 port from the host. The health
        # body must report db=connected (real Postgres over the compose
        # network), NOT degraded-in-memory — that is the proof the Docker
        # install path actually wired PG_HOST=db through to the server.
        run: |
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:3001/api/health 2>/dev/null || echo 000)
            if [ "$code" = "200" ] && \
               { grep -q '"status":"ok"' /tmp/health.json 2>/dev/null || grep -q '"status": "ok"' /tmp/health.json 2>/dev/null; }; then
              if grep -q '"db":"connected"' /tmp/health.json 2>/dev/null || \
                 grep -q '"db": "connected"' /tmp/health.json 2>/dev/null; then
                echo "✓ GET /api/health → 200 (status=ok, db=connected)"
                cat /tmp/health.json; echo
                ok=1
                break
              fi
            fi
            echo "waiting for /api/health (attempt $i/60, last code=$code)..."
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "✗ /api/health did not return 200+ok+db=connected within 120s"
            echo "--- server logs (last 80 lines) ---"
            docker compose logs --tail=80 server || true
            exit 1
          fi

      - name: Run DB migrations (validates the SQL path incl. migration 013)
        # The runtime image has no tsx (it's a pruned devDependency), so
        # invoke the compiled migrate entrypoint directly. This proves the
        # Docker install path is real: every migration applies against the
        # compose `db` service, including 013_admin_plan.sql which lets
        # users.plan='admin' (so `npm run make-admin` can promote a user).
        # pathToFileURL in migrate.ts's CLI guard resolves the relative
        # path, so this works without an absolute path.
        run: docker compose exec -T server node dist/src/db/migrate.js

      - name: Confirm the frontend is served on :8080
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ 2>/dev/null || echo 000)
          if [ "$code" != "200" ]; then
            echo "✗ app on :8080 did not return 200 (got $code)"
            docker compose logs --tail=40 app || true
            exit 1
          fi
          echo "✓ GET / on :8080 → 200 (frontend served)"

      - name: Tear down
        # `if: always()` so the stack is cleaned up even if a prior step
        # failed — no leaking containers/volumes between CI runs.
        if: always()
        run: docker compose down -v --remove-orphans

