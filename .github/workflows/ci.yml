name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server:
    name: Server (typecheck + tests + grep-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 LTS — required by isolated-vm@6.1.2 (engines.node >= 22).
          # Code Siren's Security Sandbox (server/src/security/sandbox.ts)
          # uses isolated-vm for V8-isolate-based code execution. Node 20
          # fails to compile isolated-vm because V8's SourceLocation API
          # is incompatible. Bumping to Node 22 matches the dependency's
          # declared engines requirement and resolves the build failure.
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run test -- --exclude tests/unit/run-tests.test.ts --exclude tests/unit/playwright-client.test.ts --exclude tests/unit/ghost-remediation.test.ts
      - run: npm audit --audit-level=high
      - run: bash ../scripts/grep-audit.sh

  app:
    name: App (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match server job — Node 22 LTS (no native modules in app, but
          # keeping the versions aligned avoids drift and surprises later).
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx eslint . --max-warnings 0
      - run: npx vitest run
      - run: npm run build
