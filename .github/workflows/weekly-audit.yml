name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC

jobs:
  audit:
    name: Weekly npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Server audit
        working-directory: server
        run: npm ci && npm audit --audit-level=high
      - name: App audit (production deps only)
        # Tailwind v3 build tooling (braces, chokidar, fast-glob, micromatch,
        # tailwindcss) is dev-only and has no non-breaking fix until the v4
        # migration. Audit only what ships. See app/SECURITY-NOTES.md.
        working-directory: app
        run: npm ci && npm audit --omit=dev --audit-level=high
